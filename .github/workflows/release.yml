name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: macos-15
            name: macos-universal
          - os: windows-latest
            name: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang \
            libssl-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libegl1-mesa-dev libvulkan-dev libasound2-dev \
            libglib2.0-dev libgtk-3-dev

      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        run: |
          # Two release builds plus the DMG need room; the runner ships
          # SDKs this project never uses.
          sudo rm -rf "$HOME/Library/Android/sdk" || true
          sudo rm -rf /usr/local/share/dotnet || true
          sudo rm -rf /usr/local/.ghcup || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries (Linux)
        if: runner.os == 'Linux'
        run: cargo relay-build

      - name: Build universal release binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo relay-build --target aarch64-apple-darwin
          cargo relay-build --target x86_64-apple-darwin

      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p relay-ui -p relay-cli

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp target/release/relay dist/relay-linux-x86_64
          cp target/release/relay-cli dist/relay-cli-linux-x86_64
          cp target/release/relay-clear dist/relay-clear-linux-x86_64
          chmod +x dist/relay-linux-x86_64 dist/relay-cli-linux-x86_64 dist/relay-clear-linux-x86_64
          ./dist/relay-cli-linux-x86_64 --version
          ./dist/relay-linux-x86_64 --version
          ./dist/relay-clear-linux-x86_64 > /dev/null
          cp LICENSE README.md dist/
          cp packaging/io.github.csemanpeter.Relay.desktop dist/
          cp -r packaging/icons dist/icons
          tar -C dist -czf dist/release/relay-linux-x86_64.tar.gz \
            relay-linux-x86_64 relay-cli-linux-x86_64 relay-clear-linux-x86_64 \
            README.md LICENSE io.github.csemanpeter.Relay.desktop icons
          cd dist/release
          sha256sum relay-linux-x86_64.tar.gz > SHA256SUMS-linux

      - name: Package app bundle and DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist/release "dist/Relay.app/Contents/MacOS" "dist/Relay.app/Contents/Resources"
          lipo -create -output dist/relay \
            target/aarch64-apple-darwin/release/relay \
            target/x86_64-apple-darwin/release/relay
          lipo -create -output dist/relay-cli \
            target/aarch64-apple-darwin/release/relay-cli \
            target/x86_64-apple-darwin/release/relay-cli
          lipo -create -output dist/relay-clear \
            target/aarch64-apple-darwin/release/relay-clear \
            target/x86_64-apple-darwin/release/relay-clear
          chmod +x dist/relay dist/relay-cli dist/relay-clear
          ./dist/relay-cli --version
          ./dist/relay --version
          ./dist/relay-clear > /dev/null
          cp dist/relay dist/relay-cli dist/relay-clear dist/Relay.app/Contents/MacOS/
          # The linked binaries are final; drop intermediate objects so the
          # DMG and archives have free space to work with.
          rm -rf target/aarch64-apple-darwin/release/deps target/aarch64-apple-darwin/release/build \
                 target/x86_64-apple-darwin/release/deps target/x86_64-apple-darwin/release/build
          sed "s/__VERSION__/$version/g" packaging/macos/Info.plist > dist/Relay.app/Contents/Info.plist
          printf 'APPL????' > dist/Relay.app/Contents/PkgInfo

          iconset=dist/Relay.iconset
          mkdir -p "$iconset"
          source_icon=packaging/icons/relay-1024.png
          for entry in "16 16x16" "32 16x16@2x" "32 32x32" "64 32x32@2x" \
                       "128 128x128" "256 128x128@2x" "256 256x256" \
                       "512 256x256@2x" "512 512x512" "1024 512x512@2x"; do
            size=${entry%% *}
            name=${entry##* }
            sips -z "$size" "$size" "$source_icon" --out "$iconset/icon_${name}.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o dist/Relay.app/Contents/Resources/Relay.icns
          codesign --force --deep --sign - dist/Relay.app
          codesign --force --sign - dist/relay
          codesign --force --sign - dist/relay-cli
          codesign --force --sign - dist/relay-clear

          cp LICENSE README.md dist/
          tar -C dist -czf dist/release/relay-macos-universal.tar.gz \
            Relay.app relay relay-cli relay-clear README.md LICENSE

          mkdir -p dist/dmg/CLI
          cp -R dist/Relay.app dist/dmg/
          cp dist/relay-cli dist/relay-clear dist/dmg/CLI/
          cp dist/README.md dist/LICENSE dist/dmg/CLI/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Relay" -srcfolder dist/dmg -ov -format UDZO \
            "dist/release/Relay-${version}-macos-universal.dmg"
          cd dist/release
          shasum -a 256 relay-macos-universal.tar.gz "Relay-${version}-macos-universal.dmg" > SHA256SUMS-macos

      - name: Package installer and ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist\release | Out-Null
          Copy-Item target\release\relay.exe dist\relay.exe
          Copy-Item target\release\relay-cli.exe dist\relay-cli.exe
          Copy-Item target\release\relay-clear.exe dist\relay-clear.exe
          Copy-Item LICENSE, README.md dist\
          dist\relay-cli.exe --version | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "relay-cli failed to start" }
          dist\relay-clear.exe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "relay-clear failed to start" }
          $gui = Start-Process -FilePath dist\relay.exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($gui.ExitCode -ne 0) { throw "relay failed to start" }
          Compress-Archive -Force -Path dist\relay.exe, dist\relay-cli.exe, dist\relay-clear.exe, dist\README.md, dist\LICENSE -DestinationPath dist\release\relay-windows-x64.zip

          choco install innosetup --no-progress -y
          $env:RELAY_VERSION = "${{ steps.version.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\relay.iss

          $lines = Get-ChildItem dist\release\* -Include *.zip, *.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content dist\release\SHA256SUMS-windows -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.name }}
          if-no-files-found: error
          path: dist/release/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
