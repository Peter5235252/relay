[package]
name = "relay-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Relay desktop application."
default-run = "relay"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
base64.workspace = true
relay-core.workspace = true
relay-providers.workspace = true
relay-store.workspace = true
relay-engine.workspace = true
relay-daemon.workspace = true
chrono.workspace = true
getrandom = "0.3"
gpui-kit.workspace = true
hex = "0.4"
keyring.workspace = true
ring = "0.17"
smol.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true
reqwest.workspace = true
futures-util.workspace = true
serde_json.workspace = true
portable-pty.workspace = true
regex = "1"
urlencoding = "2"

[lints]
workspace = true

[build-dependencies]
winresource = "0.1"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
sysinfo.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }
