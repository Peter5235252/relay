[package]
name = "relay-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Relay command-line client with the desktop app's full capability set."

[[bin]]
name = "relay-cli"
path = "src/main.rs"

[[bin]]
name = "relay-clear"
path = "src/bin/relay-clear.rs"

[dependencies]
relay-core.workspace = true
relay-engine.workspace = true
relay-providers.workspace = true
relay-store.workspace = true
chrono.workspace = true
rpassword = "7"
serde.workspace = true
serde_json.workspace = true
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3"
